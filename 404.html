    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f9fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .error-container {
            max-width: 600px;
            text-align: center;
            background: #ffffff;
            padding: 60px 50px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .error-icon {
            font-size: 80px;
            color: #0A3D91;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 72px;
            font-weight: 700;
            color: #0A3D91;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }
        h2 {
            font-size: 24px;
            font-weight: 600;
            color: #172033;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 8px;
            line-height: 1.6;
        }
        .error-divider {
            width: 60px;
            height: 3px;
            background: #0A3D91;
            border-radius: 2px;
            margin: 20px auto;
        }
        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            font-weight: 600;
            font-size: 15px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #0A3D91;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #082e6e;
            transform: translateY(-2px);
        }
        .btn-outline {
            border: 2px solid #0A3D91;
            color: #0A3D91;
            background: transparent;
        }
        .btn-outline:hover {
            background: #f0f5ff;
            transform: translateY(-2px);
        }
        .btn i {
            font-size: 14px;
        }
        .help-links {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .help-links a {
            color: #0A3D91;
            font-weight: 500;
            text-decoration: none;
        }
        .help-links a:hover {
            text-decoration: underline;
        }
        .help-links span {
            color: #d1d5db;
        }
        @media (max-width: 480px) {
            .error-container {
                padding: 40px 24px;
            }
            h1 {
                font-size: 56px;
            }
            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-icon">
            <i class="fa-regular fa-circle-exclamation"></i>
        </div>

        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Sorry, the page you are looking for doesn't exist or has been moved.</p>
        <p style="font-size:14px; color:#9ca3af;">If you typed the URL, please check the spelling.</p>

        <div class="error-divider"></div>

        <div class="btn-group">
            <a href="/" class="btn btn-primary">
                <i class="fa-solid fa-arrow-left"></i> Return Home
            </a>
            <a href="/company/contact/" class="btn btn-outline">
                Contact Us <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <div class="help-links">
            <a href="/services/">Services</a>
            <span>|</span>
            <a href="/support/help-centre/">Help Centre</a>
            <span>|</span>
            <a href="/support/faq/">FAQ</a>
        </div>
    </div>

</body>
